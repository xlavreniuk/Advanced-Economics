plugins {
    id 'java'
}

def configProps = new Properties()
def propsFile = file('config/gradle.properties')
if (propsFile.exists()) {
    propsFile.withInputStream { configProps.load(it) }
}

allprojects {
    group = configProps.getProperty('mod_group', 'com.example.advancedeconomics')
    version = configProps.getProperty('mod_version', '0.3')

    configProps.each { key, val ->
        ext[key.toString()] = val.toString()
    }
}

subprojects {
    apply plugin: 'java'

    tasks.withType(JavaCompile).configureEach {
        options.release = 17
    }

    repositories {
        mavenCentral()
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.neoforged.net/releases' }
    }

    dependencies {
        implementation 'org.slf4j:slf4j-api:2.0.9'
    }
}

task copyArtifactsToBuildFolder {
    description = "Collects built mod jars into separate subfolders inside build/ and deploys only our mod jar to Prism Launcher"
    dependsOn subprojects.collect { it.tasks.matching { t -> t.name == 'jar' || t.name == 'remapJar' } }

    doLast {
        copy {
            from project(':common').layout.buildDirectory.dir("libs")
            into "${rootDir}/build/source"
        }
        copy {
            from project(':fabric').layout.buildDirectory.dir("libs")
            into "${rootDir}/build/fabric"
        }
        copy {
            from project(':neoforge').layout.buildDirectory.dir("libs")
            into "${rootDir}/build/neoforge"
        }

        // Deploy strictly ONLY our mod jar without touching fabric-api or any other user mod
        def prismModsDir = file("${System.getProperty('user.home')}/Library/Application Support/PrismLauncher/instances/26.2 - Fabric/minecraft/mods")
        if (prismModsDir.exists()) {
            prismModsDir.listFiles().each { f ->
                // Protect fabric-api and only remove previous versions of our own mod jar
                if ((f.name.matches("^fabric-0\\.\\d+\\.jar\$") || f.name.startsWith("advanced_economics")) && !f.name.contains("fabric-api")) {
                    f.delete()
                }
            }
            copy {
                from project(':fabric').layout.buildDirectory.dir("libs")
                into prismModsDir
            }
            println "Safely deployed project mod jar to Prism Launcher without touching user mods."
        }
    }
}
