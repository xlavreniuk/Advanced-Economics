plugins {
    id 'java'
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT' apply false
}

def configProps = new Properties()
def propsFile = file('config/gradle.properties')
if (propsFile.exists()) {
    propsFile.withInputStream { configProps.load(it) }
}

allprojects {
    group = configProps.getProperty('mod_group', 'com.example.advancedeconomics')
    version = configProps.getProperty('mod_version', '0.3')

    configProps.each { key, val ->
        ext[key.toString()] = val.toString()
    }
}

subprojects {
    repositories {
        mavenCentral()
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://api.modrinth.com/maven' }
    }
}

task copyArtifactsToBuildFolder {
    description = "Collects built mod jars and deploys to Prism Launcher"
    dependsOn subprojects.collect { it.tasks.matching { t -> t.name == 'remapJar' || t.name == 'jar' } }

    doLast {
        copy {
            from project(':common').layout.buildDirectory.dir("libs")
            into "${rootDir}/build/source"
        }
        // Loom produces a remapped jar - use the main jar from fabric/build/libs
        def fabricLibsDir = project(':fabric').layout.buildDirectory.dir("libs").get().asFile
        if (fabricLibsDir.exists()) {
            copy {
                from fabricLibsDir
                into "${rootDir}/build/fabric"
                include "*.jar"
                exclude "*-dev.jar"
                exclude "*-sources.jar"
            }
        }
        copy {
            from project(':neoforge').layout.buildDirectory.dir("libs")
            into "${rootDir}/build/neoforge"
        }

        // Deploy strictly ONLY our mod jar to Prism Launcher (never touch fabric-api, uilib, etc.)
        def prismModsDir = file("${System.getProperty('user.home')}/Library/Application Support/PrismLauncher/instances/26.2 - Fabric/minecraft/mods")
        if (prismModsDir.exists()) {
            // Remove only our old mod jars
            prismModsDir.listFiles().each { f ->
                if (f.name.matches("^fabric-0\\.\\d+\\.jar\$") || f.name.startsWith("advanced_economics")) {
                    f.delete()
                }
            }
            if (fabricLibsDir.exists()) {
                copy {
                    from fabricLibsDir
                    into prismModsDir
                    include "*.jar"
                    exclude "*-dev.jar"
                    exclude "*-sources.jar"
                }
            }
            println "Deployed mod jar to Prism Launcher mods folder."
        }
    }
}
