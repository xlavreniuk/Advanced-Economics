plugins {
    id 'java-library'
}

dependencies {
    // Common module has no Minecraft dependencies
    // All MC-specific code lives in fabric/ or neoforge/
    implementation 'org.slf4j:slf4j-api:2.0.9'
    compileOnly 'com.google.code.gson:gson:2.10.1'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}
